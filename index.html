  <!-- Global SVG Defs: Andrej's Exact Organic Noise Frosted Glass Engine & Brushed Platinum Gradients -->
  <!-- width/height stay non-zero so userSpaceOnUse primitives (blur 4, distort 8)
       are not resolved against a 0×0 viewport. CSS hides the sprite. -->
  <svg class="svg-defs" aria-hidden="true" focusable="false" width="1440" height="900">
    <defs>
      <!-- Organic refraction: fractal noise, contrast, blur 4, distort 8.
           The region is the element box only, and feComposite "in" restores
           SourceGraphic alpha so the displacement map cannot paint an opaque
           grey plate over backdrop-filter. -->
      <filter id="ma-organic-glass-filter" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="5" result="rawNoise" />
        <feComponentTransfer in="rawNoise" result="contrastedNoise">
          <feFuncR type="linear" slope="2" intercept="-0.5" />
          <feFuncG type="linear" slope="2" intercept="-0.5" />
          <feFuncB type="linear" slope="2" intercept="-0.5" />
          <feFuncA type="discrete" tableValues="1" />
        </feComponentTransfer>
        <feGaussianBlur in="contrastedNoise" stdDeviation="4" result="smoothNoise" />
        <feDisplacementMap in="SourceGraphic" in2="smoothNoise" scale="8" xChannelSelector="R" yChannelSelector="G" result="refracted" />
        <feComposite in="refracted" in2="SourceGraphic" operator="in" />
      </filter>

      <!-- Outside-Only Cast Shadow Filter:
           angle: -171 deg -> dx: -17.78px, dy: -2.82px, blur: 5px, color: #000000, opacity: 0.2 -->
      <filter id="ma-outside-shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="-17.78" dy="-2.82" stdDeviation="5" flood-color="#000000" flood-opacity="0.2" />
      </filter>

      <!-- Fine Film Grain Filter for Obsidian Canvas -->
      <filter id="ma-film-grain">
        <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="3" stitchTiles="stitch" />
        <feColorMatrix type="saturate" values="0" />
      </filter>

      <!-- Brushed Platinum Specular Rim Gradients -->
      <linearGradient id="platinum-rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
        <stop offset="22%" stop-color="#E4E2DD" stop-opacity="0.75" />
        <stop offset="52%" stop-color="#C5C2B8" stop-opacity="0.32" />
        <stop offset="78%" stop-color="#8E8C84" stop-opacity="0.58" />
        <stop offset="100%" stop-color="#F4F1EA" stop-opacity="0.90" />
      </linearGradient>

      <linearGradient id="platinum-inset-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
        <stop offset="45%" stop-color="#E4E2DD" stop-opacity="0.22" />
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.5" />
      </linearGradient>

      <linearGradient id="platinum-foil-grad" x1="0%" y1="0%" x2="100%" y2="85%">

      <linearGradient id="champagne-arc-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#E4E2DD" stop-opacity="0" />
        <stop offset="25%" stop-color="#F4F1EA" stop-opacity="0.88" />
        <stop offset="55%" stop-color="#DFC8A2" stop-opacity="0.96" />
        <stop offset="80%" stop-color="#E4E2DD" stop-opacity="0.75" />
        <stop offset="100%" stop-color="#C5C2B8" stop-opacity="0" />
      </linearGradient>
      <!-- Side arcs: fade along the vertical span so the tips dissolve -->
      <linearGradient id="champagne-arc-grad-vert" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#E4E2DD" stop-opacity="0" />
        <stop offset="25%" stop-color="#F4F1EA" stop-opacity="0.88" />
        <stop offset="55%" stop-color="#DFC8A2" stop-opacity="0.96" />
        <stop offset="80%" stop-color="#E4E2DD" stop-opacity="0.75" />
        <stop offset="100%" stop-color="#C5C2B8" stop-opacity="0" />

      <linearGradient id="champagne-core-vert" x1="0%" y1="0%" x2="0%" y2="100%">

        <stop offset="22%" stop-color="#F4F1EA" stop-opacity="0.92" />

        <stop offset="18%" stop-color="#F4F1EA" stop-opacity="0.92" />
